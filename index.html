
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160d27">
<title>MHA.NET | پنل مدیریت</title>

<style>
:root {
  --bg:#100a1c;
  --panel:#1c1230;
  --panel2:#25183b;
  --purple:#8b45d8;
  --red:#e54459;
  --orange:#ff7438;
  --text:#f8f3ff;
  --muted:#a99bbd;
  --border:#39294d;
  --green:#36c98a;
  --yellow:#f4bd55;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Tahoma,Arial,sans-serif;font-size:14px;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#authPage{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 20%,#49236a 0,transparent 38%),
  radial-gradient(circle at 90% 90%,#541b34 0,transparent 35%),var(--bg);
}
.auth-card{
  width:100%;max-width:420px;background:#1d1430;
  border:1px solid var(--border);border-radius:22px;
  padding:28px;box-shadow:0 20px 70px #0008;
}
.logo{
  width:65px;height:65px;border-radius:20px;
  display:grid;place-items:center;margin:0 auto 15px;
  background:linear-gradient(135deg,var(--orange),var(--red));
  font-size:32px;box-shadow:0 8px 30px #e5445944;
}
.auth-card h1{text-align:center;margin:8px 0;color:white}
.auth-card p{text-align:center;color:var(--muted);line-height:1.9}
.tabs{display:flex;gap:8px;margin:22px 0}
.tabs button{
  flex:1;padding:12px;border:1px solid var(--border);
  border-radius:10px;background:var(--panel2);color:white;
}
.tabs button.active{background:var(--purple);border-color:var(--purple)}
.field{margin:13px 0}
.field label{display:block;color:#d9cde8;margin-bottom:8px}
input,select,textarea{
  width:100%;padding:12px 13px;border-radius:10px;
  border:1px solid var(--border);background:#120d1e;
  color:white;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:90px;resize:vertical}
.btn{
  border:0;border-radius:10px;padding:12px 17px;
  background:linear-gradient(120deg,var(--purple),var(--red));
  color:white;font-weight:bold;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#38264e;border:1px solid var(--border)}
.btn.danger{background:#922d43}
.btn.green{background:#167b59}
.btn.small{padding:7px 10px;font-size:12px}
.full{width:100%}
.message{
  padding:11px;border-radius:10px;margin:12px 0;
  line-height:1.8;background:#352039;color:#ffd5d9;
}
.message.success{background:#153d31;color:#a8f4d4}
#app{min-height:100vh}
.topbar{
  height:65px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;background:#1b1229;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:17px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--orange),var(--red));
  display:grid;place-items:center;font-size:21px;
}
.top-actions{display:flex;align-items:center;gap:10px}
.layout{display:flex;min-height:calc(100vh - 65px)}
.sidebar{
  width:245px;background:#191126;border-left:1px solid var(--border);
  padding:17px 12px;flex-shrink:0;
}
.user-box{
  padding:14px;background:var(--panel);border:1px solid var(--border);
  border-radius:13px;margin-bottom:17px;
}
.user-box strong{display:block;margin-bottom:6px}
.user-box small{color:var(--muted)}
.nav-title{font-size:11px;color:#8e7ba5;padding:13px 10px 7px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  text-align:right;border:0;background:transparent;color:#d8cce8;
  padding:12px;border-radius:10px;margin:2px 0;
}
.nav-btn:hover,.nav-btn.active{background:#38234f;color:white}
.nav-btn.active{border-right:3px solid var(--orange)}
.main{flex:1;min-width:0;padding:22px}
.page-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.page-head h2{margin:0;font-size:21px}
.muted{color:var(--muted)}
.cards{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;margin-bottom:20px;
}
.stat{
  background:var(--panel);border:1px solid var(--border);
  padding:17px;border-radius:15px;min-width:0;
}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat strong{display:block;font-size:25px;margin-top:12px;overflow-wrap:anywhere}
.stat .icon{font-size:22px}
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:15px;padding:17px;margin-bottom:17px;min-width:0;
}
.panel h3{margin:0 0 15px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:580px}
th,td{
  padding:12px 10px;border-bottom:1px solid var(--border);
  text-align:right;white-space:nowrap;
}
th{font-size:12px;color:#bcaaca;background:#251a36}
td{font-size:13px}
.status{
  display:inline-block;padding:5px 9px;border-radius:20px;
  font-size:11px;background:#392b47;color:#ddd;
}
.status.active,.status.online,.status.paid{background:#164b39;color:#9af0c7}
.status.blocked,.status.offline,.status.failed,.status.cancelled{background:#592638;color:#ffb4c0}
.status.pending,.status.draft,.status.suspended{background:#55431f;color:#ffdc8b}
.actions{display:flex;gap:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .wide{grid-column:1/-1}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.toolbar input{max-width:260px}
.notice{
  padding:12px 14px;background:#332541;border-right:3px solid var(--orange);
  border-radius:9px;line-height:1.9;color:#e5d8f1;margin-bottom:15px;
}
#toast{
  position:fixed;bottom:20px;left:20px;z-index:20;
  max-width:90%;padding:13px 17px;border-radius:11px;
  background:#30203e;border:1px solid var(--border);
  box-shadow:0 8px 30px #0007;display:none;
}
#toast.show{display:block}
.mobile-menu{display:none}
.modal-bg{
  position:fixed;inset:0;background:#0009;z-index:15;
  display:flex;align-items:center;justify-content:center;padding:15px;
}
.modal{
  width:100%;max-width:560px;max-height:90vh;overflow:auto;
  background:var(--panel);border:1px solid var(--border);
  border-radius:17px;padding:20px;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h3{margin:0}
.modal-close{background:none;border:0;color:white;font-size:24px}
.footer-note{font-size:11px;color:var(--muted);line-height:1.8;margin-top:20px}
@media(max-width:950px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{width:210px}
}
@media(max-width:680px){
  .sidebar{
    display:none;position:fixed;right:0;top:65px;bottom:0;
    z-index:10;width:270px;overflow:auto;box-shadow:0 10px 30px #0008;
  }
  .sidebar.open{display:block}
  .mobile-menu{display:inline-block}
  .main{padding:14px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:13px}
  .stat strong{font-size:21px}
  .grid2,.form-grid{grid-template-columns:1fr}
  .form-grid .wide{grid-column:auto}
  .topbar{padding:0 10px}
}
</style>
</head>

<body>

<section id="authPage">
  <div class="auth-card">
    <div class="logo">🦁</div>
    <h1>به پنل MHA.NET خوش آمدید</h1>
    <p>سامانه مدیریت سرویس و اشتراک VPN</p>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="setAuthMode('login')">ورود</button>
      <button id="registerTab" onclick="setAuthMode('register')">ثبت‌نام</button>
    </div>

    <form id="authForm">
      <div class="field">
        <label>نام کاربری</label>
        <input id="authUsername" required minlength="3" maxlength="32"
          autocomplete="username" placeholder="نام کاربری">
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input id="authPassword" required type="password" minlength="8"
          autocomplete="current-password" placeholder="حداقل ۸ کاراکتر">
      </div>
      <div id="extraRegister" class="hidden">
        <div class="field">
          <label>ایمیل (اختیاری)</label>
          <input id="authEmail" type="email" placeholder="example@email.com">
        </div>
        <div class="field">
          <label>شماره تماس (اختیاری)</label>
          <input id="authPhone" placeholder="شماره تماس">
        </div>
      </div>
      <div id="authMessage"></div>
      <button id="authSubmit" class="btn full" type="submit">ورود به پنل</button>
    </form>
    <div class="footer-note">MHA.NET · مدیریت هوشمند سرویس‌های VPN</div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <button class="btn secondary mobile-menu" onclick="toggleSidebar()">☰</button>
      <div class="brand-mark">🦁</div>
      <span>MHA.NET</span>
    </div>
    <div class="top-actions">
      <span id="topUsername" class="muted"></span>
      <button class="btn secondary small" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="user-box">
        <strong id="sideUsername">کاربر</strong>
        <small id="sideRole">حساب کاربری</small>
      </div>

      <div class="nav-title">داشبورد</div>
      <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard',this)">▦ داشبورد</button>
      <button class="nav-btn" data-page="subscriptions" onclick="navigate('subscriptions',this)">◷ اشتراک‌های من</button>
      <button class="nav-btn" data-page="configs" onclick="navigate('configs',this)">⌘ کانفیگ‌های من</button>
      <button class="nav-btn" data-page="payments" onclick="navigate('payments',this)">＄ پرداخت‌ها</button>
      <button class="nav-btn" data-page="tickets" onclick="navigate('tickets',this)">✉ پشتیبانی</button>

      <div id="adminNav" class="hidden">
        <div class="nav-title">مدیریت سیستم</div>
        <button class="nav-btn" data-page="users" onclick="navigate('users',this)">♙ کاربران</button>
        <button class="nav-btn" data-page="servers" onclick="navigate('servers',this)">▣ سرورها</button>
        <button class="nav-btn" data-page="plans" onclick="navigate('plans',this)">▤ پلن‌ها و تعرفه‌ها</button>
        <button class="nav-btn" data-page="allSubscriptions" onclick="navigate('allSubscriptions',this)">◷ مدیریت اشتراک‌ها</button>
        <button class="nav-btn" data-page="allConfigs" onclick="navigate('allConfigs',this)">⌘ مدیریت کانفیگ‌ها</button>
        <button class="nav-btn" data-page="allPayments" onclick="navigate('allPayments',this)">＄ مدیریت پرداخت‌ها</button>
        <button class="nav-btn" data-page="allTickets" onclick="navigate('allTickets',this)">✉ تیکت‌ها</button>
        <button class="nav-btn" data-page="logs" onclick="navigate('logs',this)">☷ گزارش فعالیت</button>
      </div>

      <div class="nav-title">شخصی</div>
      <button class="nav-btn" data-page="settings" onclick="navigate('settings',this)">⚙ تنظیمات</button>
      <button class="nav-btn" onclick="openSupport()">ⓘ ارتباط با پشتیبانی</button>
    </aside>

    <main class="main">
      <div id="pageContent"></div>
    </main>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
"use strict";

/* آدرس Worker خودت را اینجا قرار بده */
const API_BASE = "https://YOUR-WORKER-NAME.workers.dev";

let token = sessionStorage.getItem("mha_token") || "";
let currentUser = null;
let currentPage = "dashboard";
let authMode = "login";
let cached = {};

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 3500);
}

function money(value) {
  return Number(value || 0).toLocaleString("fa-IR") + " تومان";
}

function date(value) {
  if (!value) return "—";
  return new Date(Number(value) * 1000).toLocaleDateString("fa-IR");
}

function statusLabel(value) {
  const labels = {
    active:"فعال",online:"آنلاین",offline:"آفلاین",
    blocked:"مسدود",suspended:"تعلیق‌شده",
    expired:"منقضی",cancelled:"لغوشده",
    pending:"در انتظار",paid:"پرداخت‌شده",
    failed:"ناموفق",refunded:"برگشت‌خورده",
    draft:"پیش‌نویس",open:"باز",answered:"پاسخ داده‌شده",
    closed:"بسته‌شده"
  };
  return labels[value] || value || "نامشخص";
}

function statusHTML(value) {
  return `<span class="status ${escapeHTML(value)}">${escapeHTML(statusLabel(value))}</span>`;
}

async function api(path, options = {}) {
  if (!API_BASE || API_BASE.includes("YOUR-WORKER-NAME")) {
    throw new Error("ابتدا آدرس Worker را در API_BASE وارد کن.");
  }

  const headers = {
    "Content-Type":"application/json",
    ...(token ? {"Authorization":"Bearer " + token} : {}),
    ...(options.headers || {})
  };

  let response;
  try {
    response = await fetch(API_BASE.replace(/\/$/,"") + path, {
      method:options.method || "GET",
      headers,
      body:options.body ? JSON.stringify(options.body) : undefined
    });
  } catch (error) {
    throw new Error("ارتباط با Worker برقرار نشد. آدرس و تنظیمات CORS را بررسی کن.");
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.ok === false) {
    if (response.status === 401) {
      token = "";
      sessionStorage.removeItem("mha_token");
    }
    throw new Error(data.message || data.error || "درخواست ناموفق بود.");
  }

  return data;
}

function setAuthMode(mode) {
  authMode = mode;
  $("loginTab").classList.toggle("active", mode === "login");
  $("registerTab").classList.toggle("active", mode === "register");
  $("extraRegister").classList.toggle("hidden", mode !== "register");
  $("authSubmit").textContent = mode === "login" ? "ورود به پنل" : "ایجاد حساب کاربری";
  $("authPassword").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("authMessage").innerHTML = "";
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("authSubmit");
  button.disabled = true;
  button.textContent = "لطفاً صبر کنید...";
  $("authMessage").innerHTML = "";

  const payload = {
    username:$("authUsername").value.trim(),
    password:$("authPassword").value
  };

  if (authMode === "register") {
    payload.email = $("authEmail").value.trim();
    payload.phone = $("authPhone").value.trim();
  }

  try {
    const result = await api(
      authMode === "login" ? "/api/login" : "/api/register",
      {method:"POST",body:payload}
    );

    token = result.token;
    sessionStorage.setItem("mha_token", token);
    currentUser = result.user;
    showApp();
    toast(authMode === "login" ? "ورود موفق بود." : "ثبت‌نام انجام شد.");
  } catch (error) {
    $("authMessage").innerHTML =
      `<div class="message">${escapeHTML(error.message)}</div>`;
  } finally {
    button.disabled = false;
    button.textContent = authMode === "login" ? "ورود به پنل" : "ایجاد حساب کاربری";
  }
});

async function startApp() {
  if (!token) return showAuth();

  try {
    const result = await api("/api/me");
    currentUser = result.user;
    showApp();
  } catch {
    token = "";
    sessionStorage.removeItem("mha_token");
    showAuth();
  }
}

function showAuth() {
  $("authPage").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function showApp() {
  $("authPage").classList.add("hidden");
  $("app").classList.remove("hidden");

  const username = currentUser?.username || "کاربر";
  const admin = ["admin","superadmin"].includes(currentUser?.role);

  $("topUsername").textContent = username;
  $("sideUsername").textContent = username;
  $("sideRole").textContent = admin ? "مدیر سیستم" : "حساب کاربری";
  $("adminNav").classList.toggle("hidden", !admin);

  navigate("dashboard");
}

async function logout() {
  try {
    await api("/api/logout", {method:"POST"});
  } catch {}
  token = "";
  currentUser = null;
  cached = {};
  sessionStorage.removeItem("mha_token");
  showAuth();
  toast("از حساب خارج شدی.");
}

function toggleSidebar() {
  $("sidebar").classList.toggle("open");
}

function navigate(page, button) {
  currentPage = page;
  document.querySelectorAll(".nav-btn").forEach(item => item.classList.remove("active"));

  const selected = button || document.querySelector(`[data-page="${page}"]`);
  if (selected) selected.classList.add("active");

  $("sidebar").classList.remove("open");
  renderPage();
}

function pageHead(title, description = "") {
  return `<div class="page-head">
    <div><h2>${title}</h2>
    <div class="muted" style="margin-top:7px">${description}</div></div>
  </div>`;
}

function table(headers, rows) {
  if (!rows.length) return `<div class="empty">هنوز اطلاعاتی ثبت نشده است.</div>`;
  return `<div class="table-wrap"><table>
    <thead><tr>${headers.map(x => `<th>${x}</th>`).join("")}</tr></thead>
    <tbody>${rows.join("")}</tbody>
  </table></div>`;
}

function actionButtons(items) {
  return `<div class="actions">${items.join("")}</div>`;
}

function button(label, action, type = "secondary") {
  return `<button class="btn small ${type}" onclick="${action}">${label}</button>`;
}

async function load(path, key) {
  const result = await api(path);
  cached[key] = result;
  return result;
}

async function renderPage() {
  const root = $("pageContent");
  root.innerHTML = `<div class="empty">در حال دریافت اطلاعات...</div>`;

  try {
    switch (currentPage) {
      case "dashboard": return await renderDashboard();
      case "subscriptions": return await renderSubscriptions(false);
      case "configs": return await renderConfigs(false);
      case "payments": return await renderPayments(false);
      case "tickets": return await renderTickets(false);
      case "users": return await renderUsers();
      case "servers": return await renderServers();
      case "plans": return await renderPlans();
      case "allSubscriptions": return await renderSubscriptions(true);
      case "allConfigs": return await renderConfigs(true);
      case "allPayments": return await renderPayments(true);
      case "allTickets": return await renderTickets(true);
      case "logs": return await renderLogs();
      case "settings": return renderSettings();
      default:
        root.innerHTML = `<div class="panel">این بخش وجود ندارد.</div>`;
    }
  } catch (error) {
    root.innerHTML = `<div class="panel">
      <h3>خطا در دریافت اطلاعات</h3>
      <div class="message">${escapeHTML(error.message)}</div>
      <button class="btn" onclick="renderPage()">تلاش دوباره</button>
    </div>`;
  }
}

async function renderDashboard() {
  let stats = null;

  if (["admin","superadmin"].includes(currentUser.role)) {
    stats = (await load("/api/admin/overview","overview")).overview;
  }

  const subs = (await load("/api/subscriptions","subscriptions")).subscriptions || [];
  const configs = (await load("/api/configs","configs")).configs || [];

  let cards;

  if (stats) {
    cards = [
      ["کل کاربران",stats.users],
      ["کاربران فعال",stats.active_users],
      ["سرورها",stats.servers],
      ["اشتراک فعال",stats.active_subscriptions],
      ["کانفیگ‌ها",stats.configs],
      ["مجموع درآمد",money(stats.revenue)]
    ];
  } else {
    cards = [
      ["اشتراک‌ها",subs.length],
      ["کانفیگ‌ها",configs.length],
      ["نام کاربری",currentUser.username],
      ["نقش حساب",currentUser.role === "user" ? "کاربر" : currentUser.role]
    ];
  }

  $("pageContent").innerHTML = `
    ${pageHead("داشبورد MHA.NET","نمای کلی وضعیت حساب و سرویس‌ها")}
    <div class="cards">
      ${cards.map((c,i)=>`<div class="stat">
        <span>${c[0]}</span><strong>${escapeHTML(c[1])}</strong>
      </div>`).join("")}
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>اشتراک‌های اخیر</h3>
        ${subs.length ? table(
          ["شناسه","حجم","مصرف ثبت‌شده","انقضا","وضعیت"],
          subs.slice(0,5).map(s=>`<tr>
            <td>${s.id}</td><td>${s.volume_gb} GB</td>
            <td>${(Number(s.used_bytes||0)/1073741824).toFixed(2)} GB</td>

function openModal(title, content) {
  $("modalRoot").innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>${title}</h3>

        </div>
        ${content}
      </div>
    </div>`;
}

function closeModal() {
  $("modalRoot").innerHTML = "";
}

function formField(label, name, type = "text", value = "", required = true) {
  return `<div class="field">
    <label>${label}</label>
    <input name="${name}" type="${type}" value="${escapeHTML(value)}"
      ${required ? "required" : ""}>
  </div>`;
}

function formSelect(label, name, options) {
  return `<div class="field"><label>${label}</label>
    <select name="${name}">${options.map(o=>
      `<option value="${o[0]}">${o[1]}</option>`).join("")}</select>
  </div>`;
}

function formShell(fields, submitText, callback) {
  return `<form onsubmit="${callback}(event)">
    <div class="form-grid">${fields}</div>
    <button class="btn full" type="submit">${submitText}</button>
  </form>`;
}

function formValues(event) {
  return Object.fromEntries(new FormData(event.target).entries());
}

  } catch(e) { toast(e.message); }
}

async function updateTicket(id) {
  if (!confirm("این تیکت بسته شود؟")) return;
  try {
    await api("/api/admin/tickets/"+id,{
      method:"PATCH",body:{status:"closed"}
    });
    toast("تیکت بسته شد.");renderPage();
  } catch(e) { toast(e.message); }
}

startApp();
</script>
