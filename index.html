<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل MHA</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a; --card:#141a2b; --card2:#1b2238; --text:#e8ecf8; --muted:#8b95b5;
    --g1:#ff3d77; --g2:#ff9f1c; --g3:#2ee6a6; --g4:#4d7cff; --g5:#b44dff;
    --line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    background-image:radial-gradient(circle at 15% 0%,rgba(77,124,255,.18),transparent 40%),
                     radial-gradient(circle at 90% 20%,rgba(180,77,255,.15),transparent 40%);}
  .layout{display:flex;min-height:100vh}
  aside{width:250px;background:var(--card);border-left:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
  .logo{font-size:34px;font-weight:900;text-align:center;letter-spacing:3px;margin-bottom:30px;direction:ltr;
    background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g5));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:flow 5s linear infinite}
  @keyframes flow{to{background-position:200% center}}
  nav a{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:6px;border-radius:12px;
    color:var(--muted);text-decoration:none;cursor:pointer;transition:.25s}
  nav a:hover,nav a.active{background:var(--card2);color:var(--text)}
  nav a.active{box-shadow:inset -3px 0 0 var(--g4)}
  main{flex:1;padding:28px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px}
  .badge{background:var(--card2);padding:8px 14px;border-radius:30px;font-size:13px;color:var(--g3);border:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden;transition:.3s}
  .stat:hover{transform:translateY(-4px)}
  .stat::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--c)}
  .stat small{color:var(--muted)}
  .stat b{display:block;font-size:30px;margin-top:8px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}
  .box h2{font-size:17px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .ok{color:var(--g3)} .off{color:var(--g1)}
  .btn{background:linear-gradient(90deg,var(--g4),var(--g5));border:0;color:#fff;padding:11px 22px;
    border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;transition:.25s}
  .btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:12px;border-radius:12px;font-family:inherit;margin-bottom:12px}
  input:focus{outline:2px solid var(--g4)}
  @media(max-width:760px){
    .layout{flex-direction:column}
    aside{width:100%;height:auto;position:static;display:flex;flex-direction:column}
    nav{display:flex;overflow-x:auto;gap:6px} nav a{white-space:nowrap}
    .logo{margin-bottom:14px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="logo">MHA</div>
    <nav>
      <a class="active">🏠 داشبورد</a>
      <a>👥 کاربران</a>
      <a>⚙️ کانفیگ‌ها</a>
      <a>📊 آمار</a>
      <a>🔧 تنظیمات</a>
    </nav>
  </aside>

  <main>
    <header>
      <h1>خوش آمدید 👋</h1>
      <span class="badge">● سیستم فعال</span>
    </header>

    <section class="grid">
      <div class="stat" style="--c:var(--g4)"><small>کل کاربران</small><b>128</b></div>
      <div class="stat" style="--c:var(--g3)"><small>کاربران فعال</small><b>93</b></div>
      <div class="stat" style="--c:var(--g2)"><small>حجم مصرفی</small><b>412 GB</b></div>
      <div class="stat" style="--c:var(--g1)"><small>منقضی شده</small><b>7</b></div>
    </section>

    <section class="box">
      <h2>آخرین کاربران</h2>
      <table>
        <tr><th>نام</th><th>وضعیت</th><th>حجم</th></tr>
        <tr><td>کاربر ۱</td><td class="ok">فعال</td><td>12 GB</td></tr>
        <tr><td>کاربر ۲</td><td class="ok">فعال</td><td>5 GB</td></tr>
        <tr><td>کاربر ۳</td><td class="off">منقضی</td><td>30 GB</td></tr>
      </table>
    </section>

    <section class="box">
      <h2>افزودن کاربر جدید</h2>
      <input placeholder="نام کاربر">
      <input placeholder="حجم (گیگابایت)">
      <button class="btn">ثبت</button>
    </section>
  </main>
</div>
</body>
</html>
